<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Tattoo CRM — Календарь</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242424;background:#f3f3f3}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;min-height:100dvh;margin:auto;background:#fff;padding:env(safe-area-inset-top) 24px calc(110px + env(safe-area-inset-bottom));position:relative}.top{height:86px;display:flex;align-items:center;justify-content:center;position:relative}.top h1{font-size:23px;font-weight:600;margin:0}.round{position:absolute;right:0;width:49px;height:49px;border:1px solid #e4e4e4;border-radius:50%;background:#fff;font-size:24px}.months{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.months button{border:0;background:transparent;color:#888;padding:7px 10px;font-size:22px}.months span{font-size:13px;color:#a1a1a1}.week,.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{color:#858585;text-align:center;font-size:14px;margin-bottom:15px}.day{height:61px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#242424;font-size:16px;padding:4px}.day.out{color:transparent;pointer-events:none}.day.weekend{color:#888}.day.today .number{color:#ed5575}.day.selected .number{background:#282828;color:white;border-radius:50%}.number{width:30px;height:30px;display:grid;place-items:center}.dot{width:4px;height:4px;border-radius:50%;background:#242424}.no-dot{height:4px}.agenda{margin-top:28px}.heading{font-size:15px;color:#929292;margin:25px 0 11px 5px}.event{display:flex;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #f2f2f2;min-height:77px;cursor:pointer}.circle{width:23px;height:23px;border:2px solid #9d9d9d;border-radius:50%;flex-shrink:0}.event.done .circle{background:#333;border-color:#333}.event h3{font-size:17px;font-weight:500;margin:0 0 6px}.event p{font-size:14px;color:#999;margin:0}.empty{color:#aaa;padding:40px 10px;text-align:center}.add{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:340px;width:calc(100% - 76px);height:60px;border:1px solid #dedede;border-radius:35px;box-shadow:0 7px 24px #00000011;background:#fffffff2;backdrop-filter:blur(14px);font-size:16px;font-weight:550}.plus{display:inline-grid;place-items:center;background:#777;color:white;width:25px;height:25px;border-radius:50%;margin-right:12px}.shade{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}.shade.show{display:flex}.sheet{background:white;border-radius:26px 26px 0 0;padding:22px 24px calc(25px + env(safe-area-inset-bottom));width:100%;max-width:720px;max-height:92dvh;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet h2{margin:0;font-size:21px}.sheet-head button{background:none;border:0;font-size:26px}.field{display:block;margin:13px 0;color:#666;font-size:13px}.field input,.field textarea{display:block;width:100%;border:1px solid #e0e0e0;border-radius:12px;padding:13px;margin-top:6px;background:#fff;color:#222}.primary{width:100%;background:#272727;color:white;border:0;border-radius:14px;padding:15px;margin-top:12px}.secondary{width:100%;background:#f5f5f5;color:#222;border:0;border-radius:14px;padding:13px;margin-top:10px}.note{font-size:12px;color:#999;margin:14px 0}.filters{display:flex;gap:10px;margin-top:20px}.filters button{border:0;background:#f5f5f5;padding:9px 14px;border-radius:20px;color:#666}.filters button.active{background:#222;color:white}@media(min-width:768px){.app{box-shadow:0 0 24px #00000008}.day{height:75px}}
.sketch-box{margin:16px 0;padding:15px;border:1px dashed #d6d6d6;border-radius:16px;background:#fafafa}.sketch-title{font-size:14px;font-weight:600;margin-bottom:9px}.sketch-picker{display:inline-flex;align-items:center;justify-content:center;background:white;border:1px solid #dcdcdc;border-radius:12px;padding:12px 15px;color:#292929;font-size:14px;cursor:pointer}.sketch-picker input{position:absolute;width:1px;height:1px;opacity:0}.sketch-preview{display:none;margin-top:12px;max-width:100%;max-height:250px;object-fit:contain;border-radius:10px}.sketch-preview.visible{display:block}.sketch-remove{display:none;background:none;border:0;color:#b34545;padding:9px 0}.sketch-remove.visible{display:block}
</style></head><body><main class="app"><header class="top"><h1 id="monthTitle"></h1><button class="round" id="todayButton" aria-label="Сегодня">⌕</button></header><nav class="months"><button id="prev" aria-label="Предыдущий месяц">‹</button><span id="year"></span><button id="next" aria-label="Следующий месяц">›</button></nav><div class="week"><span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span></div><div class="dates" id="dates"></div><section class="agenda" id="agenda"></section></main><button class="add" id="add"><span class="plus">+</span>Добавить запись</button><div class="shade" id="shade"><section class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Новый сеанс</h2><button id="close" aria-label="Закрыть">×</button></div><form id="form"><label class="field">Дата<input type="date" name="date" required></label><label class="field">Время<input type="time" name="time" required></label><label class="field">Имя клиента<input name="name" autocomplete="off" required placeholder="Имя клиента"></label><label class="field">Телефон<input name="phone" type="tel" placeholder="+7"></label><label class="field">Дата рождения<input name="birthday" type="date"></label><label class="field">Стоимость сеанса<input name="price" type="number" min="0" step="1" placeholder="₽"></label><label class="field">Скидка, ₽<input name="discount" type="number" min="0" step="1" value="0"></label><label class="field">Описание работы<textarea name="notes" rows="2" placeholder="Описание, эскиз..."></textarea></label><div class="sketch-box"><div class="sketch-title">Эскиз татуировки</div><label class="sketch-picker">＋ Загрузить эскиз<input id="sketchInput" type="file" accept="image/*"></label><img id="sketchPreview" class="sketch-preview" alt="Предпросмотр эскиза"><button id="sketchRemove" class="sketch-remove" type="button">Удалить эскиз</button></div><p class="note">Тестовая версия: записи сохраняются в этом браузере, а эскизы — в локальном хранилище устройства. На другом устройстве они не появятся. Для постоянного хранения позже подключим Google Диск.</p><button class="primary" type="submit">Сохранить запись</button><button class="secondary" type="button" id="completed" hidden>Отметить сеанс завершённым</button></form></section></div>
<script>
const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];const now=new Date();let viewed=new Date(now.getFullYear(),now.getMonth(),1);let selected=null,editing=null;let items=[];let pendingSketch=null;let removeSketch=false;let sketchUrl=null;const sketchDB=new Promise((resolve,reject)=>{const request=indexedDB.open('tattoo-crm-sketches',1);request.onupgradeneeded=()=>request.result.createObjectStore('images');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});async function sketchGet(id){const db=await sketchDB;return new Promise((resolve,reject)=>{const tx=db.transaction('images','readonly');const q=tx.objectStore('images').get(id);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}async function sketchWrite(id,blob){const db=await sketchDB;return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function sketchDelete(id){const db=await sketchDB;return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function previewSketch(blob){if(sketchUrl)URL.revokeObjectURL(sketchUrl);sketchUrl=blob?URL.createObjectURL(blob):null;$('#sketchPreview').src=sketchUrl||'';$('#sketchPreview').classList.toggle('visible',!!blob);$('#sketchRemove').classList.toggle('visible',!!blob)}try{items=JSON.parse(localStorage.getItem('tattoo-crm-appointments-v1')||'[]')}catch{}const $=s=>document.querySelector(s);const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const save=()=>localStorage.setItem('tattoo-crm-appointments-v1',JSON.stringify(items));const formatMoney=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';function render(){const y=viewed.getFullYear(),m=viewed.getMonth();$('#monthTitle').textContent=months[m];$('#year').textContent=y;let grid=$('#dates');grid.innerHTML='';let first=(new Date(y,m,1).getDay()+6)%7;let n=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let blank=document.createElement('div');grid.append(blank)}for(let day=1;day<=n;day++){const date=iso(new Date(y,m,day));let b=document.createElement('button');b.className='day'+(new Date(y,m,day).getDay()%6===0?' weekend':'')+(date===iso(now)?' today':'')+(selected===date?' selected':'');let number=document.createElement('span');number.className='number';number.textContent=day;let dot=document.createElement('span');dot.className=items.some(x=>x.date===date)?'dot':'no-dot';b.append(number,dot);b.onclick=()=>{selected=selected===date?null:date;render()};grid.append(b)}let shown=items.filter(x=>{const p=x.date.split('-');return Number(p[0])===y&&Number(p[1])===m+1&&(!selected||x.date===selected)}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let agenda=$('#agenda');agenda.innerHTML='';let prev='';for(let e of shown){if(e.date!==prev){let h=document.createElement('div');h.className='heading';let d=Number(e.date.slice(-2));h.textContent=d+' '+months[m].slice(0,3).toLowerCase()+'.';agenda.append(h);prev=e.date}let row=document.createElement('div');row.className='event'+(e.done?' done':'');let circle=document.createElement('span');circle.className='circle';let text=document.createElement('div');let title=document.createElement('h3');title.textContent=e.time+'  '+e.name+(e.price?'  '+formatMoney(Math.max(0,Number(e.price)-Number(e.discount||0))):'');let subtitle=document.createElement('p');subtitle.textContent=e.done?'Сеанс завершён':e.notes||'Запланированный сеанс';text.append(title,subtitle);row.append(circle,text);row.onclick=()=>open(e);agenda.append(row)}if(!shown.length){let p=document.createElement('div');p.className='empty';p.textContent=selected?'На выбранный день записей нет':'На этот месяц записей пока нет';agenda.append(p)}}async function open(e=null){editing=e?.id||null;pendingSketch=null;removeSketch=false;$('#sketchInput').value='';previewSketch(null);if(e){try{const blob=await sketchGet(e.id);if(editing===e.id&&blob)previewSketch(blob)}catch(err){console.error('Не удалось загрузить эскиз',err)}}$('#sheetTitle').textContent=e?'Редактирование сеанса':'Новый сеанс';const f=$('#form');f.reset();for(let key of ['date','time','name','phone','birthday','price','discount','notes']){f.elements[key].value=e?.[key]??(key==='date'?(selected||iso(now)):key==='time'?'14:00':key==='discount'?'0':'')}$('#completed').hidden=!e;$('#completed').textContent=e?.done?'Вернуть в запланированные':'Отметить сеанс завершённым';$('#shade').classList.add('show')}function close(){$('#shade').classList.remove('show');if(sketchUrl){URL.revokeObjectURL(sketchUrl);sketchUrl=null}}$('#prev').onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()-1,1);selected=null;render()};$('#next').onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()+1,1);selected=null;render()};$('#todayButton').onclick=()=>{viewed=new Date(now.getFullYear(),now.getMonth(),1);selected=iso(now);render()};$('#add').onclick=()=>open();$('#close').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};$('#sketchInput').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Выбери изображение');e.target.value='';return}if(file.size>15*1024*1024){alert('Выбери изображение размером до 15 МБ');e.target.value='';return}pendingSketch=file;removeSketch=false;previewSketch(file)};$('#sketchRemove').onclick=()=>{pendingSketch=null;removeSketch=true;$('#sketchInput').value='';previewSketch(null)};$('#form').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());delete data.sketchInput;const id=editing||crypto.randomUUID();const button=e.target.querySelector('[type=submit]');button.disabled=true;try{if(pendingSketch)await sketchWrite(id,pendingSketch);else if(removeSketch)await sketchDelete(id);if(editing){let old=items.find(x=>x.id===editing);Object.assign(old,data)}else items.push({...data,id,done:false});save();const d=data.date.split('-');viewed=new Date(+d[0],+d[1]-1,1);selected=null;close();render()}catch(err){console.error(err);alert('Не удалось сохранить запись или эскиз. Проверь свободное место в браузере и попробуй ещё раз.')}finally{button.disabled=false}};$('#completed').onclick=()=>{let e=items.find(x=>x.id===editing);if(!e)return;e.done=!e.done;save();close();render()};render();
</script></body></html>
