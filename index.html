<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Tattoo CRM — Календарь и клиенты</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252525;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.app{max-width:720px;margin:auto;background:white;min-height:100dvh;padding:env(safe-area-inset-top) 24px calc(160px + env(safe-area-inset-bottom))}
.top{height:78px;display:flex;align-items:center;justify-content:center;position:relative}.top h1{font-size:23px;font-weight:600;margin:0}.round{position:absolute;right:0;width:46px;height:46px;border:1px solid #e4e4e4;border-radius:50%;background:#fff;font-size:14px}
.months{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.months button{border:0;background:none;color:#7e7e7e;padding:7px 12px;font-size:25px}.months span{color:#a1a1a1;font-size:13px}
.week,.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{text-align:center;color:#8d8d8d;font-size:14px;margin-bottom:15px}
.day{height:61px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px;color:#252525;font-size:16px}.day.weekend{color:#919191}.day.today .number{color:#e75476}.day.selected .number{background:#252525;color:white;border-radius:50%}.number{width:30px;height:30px;display:grid;place-items:center}.dot{width:4px;height:4px;background:#252525;border-radius:50%}.no-dot{height:4px}
.agenda{margin-top:26px}.heading{font-size:15px;color:#929292;margin:25px 0 10px 5px}.event{display:flex;align-items:center;gap:15px;border-bottom:1px solid #f0f0f0;padding:16px 0;min-height:78px;cursor:pointer}.circle{width:23px;height:23px;border:2px solid #aaa;border-radius:50%;flex-shrink:0}.event.done .circle{border-color:#333;background:#333}.event h3{font-size:17px;font-weight:500;margin:0 0 6px}.event p{font-size:14px;color:#999;margin:0}.empty{padding:36px 10px;color:#999;text-align:center}
.tabbar{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;display:flex;justify-content:center;gap:15px;background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid #eee;padding:11px 16px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:transparent;flex:1;max-width:180px;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:12px;color:#929292;padding:4px}.tabbar button.active{color:#232323;font-weight:600}.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.add{position:fixed;z-index:2;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:340px;width:calc(100% - 76px);height:58px;border:1px solid #ddd;border-radius:35px;background:#fffffff4;backdrop-filter:blur(14px);box-shadow:0 7px 24px #00000012;font-size:16px;font-weight:550}.plus{display:inline-grid;place-items:center;background:#777;color:#fff;width:25px;height:25px;border-radius:50%;margin-right:12px}
.search{width:100%;height:48px;padding:0 15px;border:1px solid #e8e8e8;background:#f7f7f7;border-radius:14px;margin:2px 0 16px}.client-item{width:100%;display:flex;align-items:center;gap:14px;padding:15px 0;background:none;border:0;border-bottom:1px solid #f0f0f0;text-align:left}.avatar{height:45px;width:45px;border-radius:50%;background:#ededed;color:#555;display:grid;place-items:center;font-size:18px;flex-shrink:0}.client-item strong{font-size:17px;font-weight:550}.client-item small{display:block;color:#999;margin-top:5px;font-size:13px}.arrow{margin-left:auto;color:#999;font-size:24px}.count{color:#aaa;font-size:13px;margin:7px 0 10px}
.shade{display:none;align-items:flex-end;justify-content:center;position:fixed;inset:0;z-index:10;background:#0006}.shade.show{display:flex}.sheet{background:#fff;border-radius:26px 26px 0 0;padding:22px 24px calc(30px + env(safe-area-inset-bottom));width:100%;max-width:720px;max-height:92dvh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet h2{margin:0;font-size:21px}.sheet-head button{border:0;background:none;font-size:27px}.field{display:block;margin:13px 0;color:#666;font-size:13px}.field input,.field textarea{display:block;width:100%;border:1px solid #e0e0e0;border-radius:12px;padding:13px;margin-top:6px;background:#fff;color:#222}.field input:focus,.search:focus{outline:1px solid #777}
.primary,.secondary{width:100%;border:0;border-radius:14px;padding:15px;margin-top:11px}.primary{background:#272727;color:white}.secondary{background:#f2f2f2;color:#222}.note{font-size:12px;color:#969696;line-height:1.5;margin:14px 0}.linked{font-size:13px;color:#526b52;min-height:17px;margin-top:5px}.sketch-box{margin:16px 0;padding:15px;border:1px dashed #d6d6d6;border-radius:16px;background:#fafafa}.sketch-title{font-size:14px;font-weight:600;margin-bottom:9px}.sketch-picker{display:inline-flex;align-items:center;border:1px solid #ddd;background:white;border-radius:12px;padding:12px 15px;font-size:14px;cursor:pointer}.sketch-picker input{position:absolute;width:1px;height:1px;opacity:0}.sketch-preview{display:none;margin-top:12px;max-width:100%;max-height:270px;object-fit:contain;border-radius:10px}.sketch-preview.visible{display:block}.sketch-remove{display:none;background:none;border:0;color:#a44;padding:12px 0}.sketch-remove.visible{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0 24px}.stat{padding:17px;background:#f6f6f6;border-radius:16px}.stat b{display:block;font-size:19px;margin-top:8px}.stat small{color:#929292;font-size:12px}.detail-meta{color:#888;font-size:14px;margin:4px 0}.detail-title{font-size:16px;font-weight:600;margin:25px 0 12px}.history{padding:15px 0;border-bottom:1px solid #eee;cursor:pointer}.history strong{display:block;font-size:15px}.history small{display:block;color:#999;font-size:13px;margin-top:6px}.history img{display:block;margin-top:12px;max-height:155px;max-width:100%;border-radius:10px;object-fit:contain}.hidden{display:none!important}@media(min-width:768px){.day{height:75px}.app{box-shadow:0 0 24px #00000008}}
</style>
</head>
<body>
<main class="app">
<header class="top"><h1 id="title">Календарь</h1><button class="round" id="todayButton" aria-label="Сегодня">Сегодня</button></header>
<section id="calendarPage">
<nav class="months"><button id="prev" aria-label="Предыдущий месяц">‹</button><span id="year"></span><button id="next" aria-label="Следующий месяц">›</button></nav>
<div class="week"><span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span></div><div class="dates" id="dates"></div><section class="agenda" id="agenda"></section>
</section>
<section id="clientsPage" class="hidden"><input id="clientSearch" class="search" type="search" placeholder="Поиск по имени или телефону" autocomplete="off"><div id="clientCount" class="count"></div><div id="clientList"></div></section>
</main>
<button class="add" id="add"><span class="plus">+</span><span id="addText">Добавить запись</span></button>
<nav class="tabbar" aria-label="Разделы"><button class="active" id="calendarTab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>Календарь</button><button id="clientsTab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Клиенты</button></nav>
<div class="shade" id="shade"><section class="sheet" id="sheet">
<div class="sheet-head"><h2 id="sheetTitle">Новый сеанс</h2><button id="close" aria-label="Закрыть">×</button></div>
<div id="appointmentView">
<form id="form">
<label class="field">Дата<input type="date" name="date" required></label>
<label class="field">Время<input type="time" name="time" required></label>
<label class="field">Телефон клиента<input type="tel" name="phone" placeholder="+7"></label>
<div class="linked" id="linked"></div>
<label class="field">Имя клиента<input name="name" autocomplete="off" required placeholder="Имя клиента"></label>
<label class="field">Дата рождения<input name="birthday" type="date"></label>
<label class="field">Стоимость сеанса<input name="price" type="number" min="0" step="1" placeholder="₽"></label>
<label class="field">Скидка, ₽<input name="discount" type="number" min="0" step="1" value="0"></label>
<label class="field">Описание работы<textarea name="notes" rows="2" placeholder="Что будем делать"></textarea></label>
<div class="sketch-box"><div class="sketch-title">Эскиз татуировки</div><label class="sketch-picker">＋ Загрузить эскиз<input id="sketchInput" type="file" accept="image/*"></label><img id="sketchPreview" class="sketch-preview" alt="Эскиз"><button id="sketchRemove" class="sketch-remove" type="button">Удалить эскиз</button></div>
<p class="note">Пока тестовая версия: клиенты и записи хранятся в этом браузере, фотографии — локально на устройстве. Для постоянного хранения подключим Google.</p>
<button class="primary" type="submit">Сохранить запись</button><button class="secondary" type="button" id="completed" hidden>Отметить сеанс завершённым</button>
</form>
</div>
<div id="clientView" class="hidden">
<div id="clientMeta"></div><div class="stats"><div class="stat"><small>Получено за сеансы</small><b id="clientRevenue">0 ₽</b></div><div class="stat"><small>Завершено сеансов</small><b id="clientSessions">0</b></div></div>
<button id="editClient" class="secondary">Изменить данные клиента</button><button id="newSession" class="primary">+ Новый сеанс для клиента</button>
<div class="detail-title">История сеансов</div><div id="clientHistory"></div>
</div>
<div id="editClientView" class="hidden"><form id="clientForm"><label class="field">Имя<input name="name" required></label><label class="field">Телефон<input type="tel" name="phone"></label><label class="field">Дата рождения<input type="date" name="birthday"></label><button class="primary" type="submit">Сохранить клиента</button></form></div>
</section></div>
<script>
'use strict';
const $=s=>document.querySelector(s),months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const now=new Date(),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽',digits=s=>String(s||'').replace(/\D/g,''),normalized=s=>{const x=digits(s);return x.length===11&&x[0]==='8'?'7'+x.slice(1):x};
const read=(key,def)=>{try{const val=JSON.parse(localStorage.getItem(key));return Array.isArray(val)?val:def}catch{return def}};
let appointments=read('tattoo-crm-appointments-v1',[]),clients=read('tattoo-crm-clients-v1',[]);
let viewed=new Date(now.getFullYear(),now.getMonth(),1),selected=null,tab='calendar',editing=null,chosenClient=null,linkedClient=null,pendingSketch=null,removeSketch=false,sketchUrl=null;
const save=()=>{localStorage.setItem('tattoo-crm-appointments-v1',JSON.stringify(appointments));localStorage.setItem('tattoo-crm-clients-v1',JSON.stringify(clients))};
const byPhone=phone=>{const n=normalized(phone);return n.length>=10?clients.find(c=>normalized(c.phone)===n):null};
const byId=id=>clients.find(c=>c.id===id);
function reconcile(){let changed=false;for(const a of appointments){let c=a.clientId&&byId(a.clientId);if(!c&&a.phone)c=byPhone(a.phone);if(!c){c={id:crypto.randomUUID(),name:a.name||'Без имени',phone:a.phone||'',birthday:a.birthday||''};clients.push(c);changed=true}if(a.clientId!==c.id){a.clientId=c.id;changed=true}}if(changed)save()}
reconcile();
const dbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('tattoo-crm-sketches',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('images'))request.result.createObjectStore('images')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function imageOperation(mode,id,blob){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('images',mode==='get'?'readonly':'readwrite'),store=tx.objectStore('images');let request;if(mode==='get'){request=store.get(id);request.onsuccess=()=>resolve(request.result)}else{mode==='put'?store.put(blob,id):store.delete(id);tx.oncomplete=()=>resolve()}tx.onerror=()=>reject(tx.error);if(request)request.onerror=()=>reject(request.error)})}
function preview(blob){if(sketchUrl)URL.revokeObjectURL(sketchUrl);sketchUrl=blob?URL.createObjectURL(blob):null;$('#sketchPreview').src=sketchUrl||'';$('#sketchPreview').classList.toggle('visible',!!blob);$('#sketchRemove').classList.toggle('visible',!!blob)}
function render(){if(tab==='calendar')renderCalendar();else renderClients()}
function renderCalendar(){const y=viewed.getFullYear(),m=viewed.getMonth();$('#title').textContent=months[m];$('#year').textContent=y;const grid=$('#dates');grid.replaceChildren();const first=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<first;i++)grid.append(document.createElement('div'));const count=new Date(y,m+1,0).getDate();for(let day=1;day<=count;day++){const d=iso(new Date(y,m,day)),button=document.createElement('button');button.className='day'+([0,6].includes(new Date(y,m,day).getDay())?' weekend':'')+(d===iso(now)?' today':'')+(selected===d?' selected':'');const num=document.createElement('span');num.className='number';num.textContent=day;const dot=document.createElement('span');dot.className=appointments.some(x=>x.date===d)?'dot':'no-dot';button.append(num,dot);button.onclick=()=>{selected=selected===d?null:d;render()};grid.append(button)}
const matching=appointments.filter(a=>{const p=a.date.split('-');return +p[0]===y&&+p[1]===m+1&&(!selected||a.date===selected)}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),agenda=$('#agenda');agenda.replaceChildren();let last='';for(const a of matching){if(a.date!==last){last=a.date;const h=document.createElement('div');h.className='heading';h.textContent=Number(a.date.slice(-2))+' '+months[m].slice(0,3).toLowerCase()+'.';agenda.append(h)}const row=document.createElement('div');row.className='event'+(a.done?' done':'');const circle=document.createElement('span');circle.className='circle';const info=document.createElement('div'),title=document.createElement('h3'),sub=document.createElement('p');title.textContent=(a.time||'—')+'  '+(byId(a.clientId)?.name||a.name)+(a.price?'  '+money(Math.max(0,+a.price-(+a.discount||0))):'');sub.textContent=a.done?'Сеанс завершён':a.notes||'Запланированный сеанс';info.append(title,sub);row.append(circle,info);row.onclick=()=>openAppointment(a);agenda.append(row)}if(!matching.length){const el=document.createElement('p');el.className='empty';el.textContent=selected?'На выбранный день записей нет':'На этот месяц записей пока нет';agenda.append(el)}}
function renderClients(){const q=$('#clientSearch').value.trim().toLowerCase(),list=clients.filter(c=>c.name.toLowerCase().includes(q)||digits(c.phone).includes(digits(q))&&!!digits(q)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));$('#clientCount').textContent='Клиентов: '+clients.length;const target=$('#clientList');target.replaceChildren();for(const c of list){const count=appointments.filter(a=>a.clientId===c.id).length,button=document.createElement('button'),avatar=document.createElement('span'),text=document.createElement('span'),name=document.createElement('strong'),hint=document.createElement('small'),arrow=document.createElement('span');button.className='client-item';avatar.className='avatar';avatar.textContent=(c.name||'?')[0].toUpperCase();name.textContent=c.name;hint.textContent=[c.phone,count+' сеанс(ов)'].filter(Boolean).join(' · ');text.append(name,hint);arrow.className='arrow';arrow.textContent='›';button.append(avatar,text,arrow);button.onclick=()=>openClient(c.id);target.append(button)}if(!list.length){const p=document.createElement('div');p.className='empty';p.textContent='Клиенты не найдены';target.append(p)}}
function setTab(next){tab=next;$('#calendarPage').classList.toggle('hidden',next!=='calendar');$('#clientsPage').classList.toggle('hidden',next!=='clients');$('#calendarTab').classList.toggle('active',next==='calendar');$('#clientsTab').classList.toggle('active',next==='clients');$('#todayButton').classList.toggle('hidden',next!=='calendar');$('#addText').textContent=next==='calendar'?'Добавить запись':'Добавить клиента';render()}
function showPanel(which,title){$('#shade').classList.add('show');$('#sheetTitle').textContent=title;for(const id of ['appointmentView','clientView','editClientView'])$('#'+id).classList.toggle('hidden',id!==which);$('#sheet').scrollTop=0}
async function openAppointment(a=null,clientId=null){editing=a?.id||null;chosenClient=clientId||a?.clientId||null;linkedClient=chosenClient?byId(chosenClient):null;pendingSketch=null;removeSketch=false;$('#sketchInput').value='';preview(null);const form=$('#form');form.reset();const c=linkedClient;for(const key of ['date','time','phone','name','birthday','price','discount','notes'])form.elements[key].value=a?.[key]??(key==='date'?selected||iso(now):key==='time'?'14:00':key==='discount'?'0':c?.[key]||'');$('#linked').textContent=c?'Привязано к карточке: '+c.name:'';$('#completed').hidden=!a;$('#completed').textContent=a?.done?'Вернуть в запланированные':'Отметить сеанс завершённым';showPanel('appointmentView',a?'Редактирование сеанса':'Новый сеанс');if(a){try{const blob=await imageOperation('get',a.id);if(editing===a.id&&blob)preview(blob)}catch(err){console.error(err)}}}
function matchPhone(){const f=$('#form'),found=byPhone(f.elements.phone.value);linkedClient=found||null;$('#linked').textContent=found?'Найден клиент: '+found.name+' — сеанс добавится в его историю':'';if(found){f.elements.name.value=found.name;f.elements.birthday.value=found.birthday||''}}
async function openClient(id){chosenClient=id;const c=byId(id);if(!c)return;$('#clientMeta').replaceChildren();const name=document.createElement('h3');name.textContent=c.name;name.style.margin='0 0 10px';$('#clientMeta').append(name);for(const line of [c.phone,c.birthday?'Дата рождения: '+c.birthday.split('-').reverse().join('.'):''])if(line){const p=document.createElement('p');p.className='detail-meta';p.textContent=line;$('#clientMeta').append(p)}const history=appointments.filter(a=>a.clientId===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),done=history.filter(a=>a.done);$('#clientRevenue').textContent=money(done.reduce((sum,a)=>sum+Math.max(0,+a.price-(+a.discount||0)),0));$('#clientSessions').textContent=done.length;const target=$('#clientHistory');target.replaceChildren();for(const a of history){const row=document.createElement('div');row.className='history';const h=document.createElement('strong');h.textContent=a.date.split('-').reverse().join('.')+' · '+a.time;const p=document.createElement('small');p.textContent=(a.done?'Завершён · ':'Запланирован · ')+money(Math.max(0,+a.price-(+a.discount||0)))+(a.notes?' · '+a.notes:'');row.append(h,p);row.onclick=()=>openAppointment(a);target.append(row);imageOperation('get',a.id).then(blob=>{if(!blob||!row.isConnected)return;const image=document.createElement('img');const url=URL.createObjectURL(blob);image.src=url;image.alt='Эскиз сеанса';image.onload=()=>URL.revokeObjectURL(url);row.append(image)}).catch(console.error)}if(!history.length){const p=document.createElement('div');p.className='empty';p.textContent='Сеансов пока нет';target.append(p)}showPanel('clientView','Карточка клиента')}
function editClient(id=null){chosenClient=id;const c=id?byId(id):null;const f=$('#clientForm');f.reset();for(const key of ['name','phone','birthday'])f.elements[key].value=c?.[key]||'';showPanel('editClientView',c?'Изменить клиента':'Новый клиент')}
function close(){if(sketchUrl){URL.revokeObjectURL(sketchUrl);sketchUrl=null}$('#shade').classList.remove('show')}
$('#prev').onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()-1,1);selected=null;render()};$('#next').onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()+1,1);selected=null;render()};$('#todayButton').onclick=()=>{viewed=new Date(now.getFullYear(),now.getMonth(),1);selected=iso(now);render()};$('#add').onclick=()=>tab==='calendar'?openAppointment():editClient();$('#calendarTab').onclick=()=>setTab('calendar');$('#clientsTab').onclick=()=>setTab('clients');$('#clientSearch').oninput=renderClients;$('#close').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};$('#form').elements.phone.oninput=matchPhone;$('#editClient').onclick=()=>editClient(chosenClient);$('#newSession').onclick=()=>openAppointment(null,chosenClient);
$('#sketchInput').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Выбери изображение');e.target.value='';return}if(file.size>15*1024*1024){alert('Максимальный размер изображения — 15 МБ');e.target.value='';return}pendingSketch=file;removeSketch=false;preview(file)};
$('#sketchRemove').onclick=()=>{pendingSketch=null;removeSketch=true;$('#sketchInput').value='';preview(null)};
$('#form').onsubmit=async event=>{event.preventDefault();const f=event.target,data=Object.fromEntries(new FormData(f).entries());delete data.sketchInput;const button=f.querySelector('[type=submit]');button.disabled=true;try{const candidate=byPhone(data.phone);let c=candidate||(chosenClient?byId(chosenClient):null);if(!c)c={id:crypto.randomUUID(),name:data.name,phone:data.phone||'',birthday:data.birthday||''};const a=editing?appointments.find(x=>x.id===editing):{id:crypto.randomUUID(),done:false};if(pendingSketch)await imageOperation('put',a.id,pendingSketch);else if(removeSketch)await imageOperation('delete',a.id);if(!clients.some(x=>x.id===c.id))clients.push(c);c.name=data.name;c.phone=data.phone;c.birthday=data.birthday;Object.assign(a,data,{clientId:c.id});if(!editing)appointments.push(a);save();const [y,m]=data.date.split('-').map(Number);viewed=new Date(y,m-1,1);selected=null;close();render()}catch(err){console.error(err);alert('Не удалось сохранить. Проверь доступное место на устройстве.')}finally{button.disabled=false}};
$('#clientForm').onsubmit=event=>{event.preventDefault();const f=event.target,data=Object.fromEntries(new FormData(f).entries());const duplicate=byPhone(data.phone);if(duplicate&&duplicate.id!==chosenClient){alert('Клиент с таким номером уже существует: '+duplicate.name);return}let c=chosenClient?byId(chosenClient):null;if(c)Object.assign(c,data);else{c={...data,id:crypto.randomUUID()};clients.push(c)}save();renderClients();openClient(c.id)};
$('#completed').onclick=()=>{const a=appointments.find(x=>x.id===editing);if(!a)return;a.done=!a.done;save();close();render()};
setTab('calendar');
</script>
</body></html>
